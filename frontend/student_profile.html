<!DOCTYPE html>

<html>

<head>

<title>Student Profile</title>

<style>
*{
box-sizing:border-box;
font-family:Segoe UI;
}

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
padding:15px;
}

.container{
width:100%;
max-width:320px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
padding:18px;
border-radius:15px;
box-shadow:0 8px 25px rgba(0,0,0,0.25);
color:white;
animation:fadeIn 0.6s ease;
}

h2{
text-align:center;
margin-bottom:12px;
font-size:18px;
}

input,select{
width:100%;
padding:9px;
margin:6px 0;
border:none;
border-radius:8px;
background:#f2f2f2;
font-size:13px;
outline:none;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:linear-gradient(90deg,#ff7a18,#ffb347);
color:white;
font-size:14px;
cursor:pointer;
margin-top:8px;
}

#msg{
display:none;
margin-top:8px;
padding:8px;
border-radius:6px;
font-size:13px;
font-weight:bold;
text-align:center;
}
</style>

</head>

<body>

<div class="container">

<h2>Complete Your Profile</h2>

<input id="name" placeholder="Full Name">

<input type="date" id="dob">

<input id="college" placeholder="College Name">

<select id="state">
<option value="">Select State</option>
</select>

<select id="city">
<option value="">Select City</option>
</select>

<label>🎓 Upload College ID</label> <input type="file" id="idCard">

<button onclick="saveProfile()">Continue</button>

<p id="msg"></p>

</div>

<script>

// 🔥 STATES + CITIES (same as tera code)
// (ye part same rahega - koi change nahi)

let data = {
"Uttar Pradesh":["Noida","Ghaziabad","Lucknow","Kanpur","Varanasi"],
"Delhi":["New Delhi","Dwarka","Rohini","Saket"],
"Haryana":["Gurgaon","Faridabad","Panipat","Ambala"],
"Maharashtra":["Mumbai","Pune","Nagpur","Nashik"],
"Karnataka":["Bangalore","Mysore","Mangalore"],
"Tamil Nadu":["Chennai","Coimbatore","Madurai"],
"Rajasthan":["Jaipur","Udaipur","Jodhpur"],
"Gujarat":["Ahmedabad","Surat","Vadodara"],
"West Bengal":["Kolkata","Howrah","Durgapur"],
"Madhya Pradesh":["Bhopal","Indore","Gwalior"],
"Bihar":["Patna","Gaya","Muzaffarpur"],
"Punjab":["Ludhiana","Amritsar","Jalandhar"],
"Kerala":["Kochi","Trivandrum","Kozhikode"],
"Telangana":["Hyderabad","Warangal"],
"Andhra Pradesh":["Vijayawada","Visakhapatnam"],
"Odisha":["Bhubaneswar","Cuttack"],
"Assam":["Guwahati","Silchar"],
"Jharkhand":["Ranchi","Jamshedpur"],
"Chhattisgarh":["Raipur","Bilaspur"],
"Uttarakhand":["Dehradun","Haridwar"],
"Himachal Pradesh":["Shimla","Manali"],
"Goa":["Panaji","Margao"],
"Tripura":["Agartala"],
"Meghalaya":["Shillong"],
"Manipur":["Imphal"],
"Nagaland":["Kohima"],
"Mizoram":["Aizawl"],
"Sikkim":["Gangtok"],
"Arunachal Pradesh":["Itanagar"]
}

// 🔥 ELEMENTS
let stateSelect = document.getElementById("state")
let citySelect = document.getElementById("city")

for(let state in data){
let opt = document.createElement("option")
opt.value = state
opt.text = state
stateSelect.add(opt)
}

stateSelect.addEventListener("change",function(){
citySelect.innerHTML = '<option value="">Select City</option>'
if(data[this.value]){
data[this.value].forEach(city=>{
let opt = document.createElement("option")
opt.value = city
opt.text = city
citySelect.add(opt)
})
}
})


// 🔥 FINAL UPDATED FUNCTION
function saveProfile(){

let name = document.getElementById("name").value.trim()
let dob = document.getElementById("dob").value
let college = document.getElementById("college").value.trim()
let location = document.getElementById("city").value
let file = document.getElementById("idCard").files[0]

let msg = document.getElementById("msg")

if(name=="" || dob=="" || college=="" || location=="" || !file){

msg.style.display="block"
msg.style.background="#ff4d4d"
msg.innerText="❌ Fill all details"

setTimeout(()=> msg.style.display="none",2000)
return
}

msg.style.display="block"
msg.style.background="#333"
msg.innerText="Saving..."

let reader = new FileReader()

reader.onload = function(){

let email = localStorage.getItem("user_email")

let profile = {
name:name,
dob:dob,
college:college,
location:location,
idCard:reader.result
}

// 🔥 SAVE PROFILE
localStorage.setItem(email+"_profile", JSON.stringify(profile))

// 🔥 IMPORTANT LINE (NEW 🔥)
localStorage.setItem("profile_done", "yes")

msg.style.background="#28a745"
msg.innerText="✅ Profile saved"

// 🔥 REDIRECT HOME
setTimeout(()=>{
window.location.href="student_home.html"
},1000)

}

reader.readAsDataURL(file)

}

</script>

</body>
</html>
