<!DOCTYPE html>
<html>

<head>

<title>Student Profile</title>

<style>
*{
box-sizing:border-box;
font-family:Segoe UI;
}

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
padding:15px;
overflow-y:auto;
}

.container{
width:100%;
max-width:320px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
padding:18px;
border-radius:15px;
box-shadow:0 8px 25px rgba(0,0,0,0.25);
color:white;
animation:fadeIn 0.6s ease;
}

h2{
text-align:center;
margin-bottom:12px;
font-size:18px;
}

input,select{
width:100%;
padding:9px;
margin:6px 0;
border:none;
border-radius:8px;
background:#f2f2f2;
font-size:13px;
outline:none;
}

input[type="file"]{
font-size:12px;
padding:6px;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:linear-gradient(90deg,#ff7a18,#ffb347);
color:white;
font-size:14px;
cursor:pointer;
margin-top:8px;
}

.input-group{
position:relative;
}

.input-group i{
position:absolute;
top:50%;
left:8px;
transform:translateY(-50%);
color:#666;
font-size:13px;
}

.input-group input,
.input-group select{
padding-left:30px;
}

#msg{
display:none;
margin-top:8px;
padding:8px;
border-radius:6px;
font-size:13px;
font-weight:bold;
text-align:center;
}

label{
font-size:12px;
display:block;
margin-top:5px;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}
</style>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="container">

<h2>Complete Your Profile</h2>

<div class="input-group">
<i class="fa fa-user"></i>
<input id="name" placeholder="Full Name">
</div>

<div class="input-group">
<i class="fa fa-phone"></i>
<input id="phone" placeholder="Phone Number">
</div>

<div class="input-group">
<i class="fa fa-building"></i>
<input id="college" placeholder="College Name">
</div>

<label>🎓 Upload College ID</label>
<input type="file" id="idCard">

<div class="input-group">
<i class="fa fa-location-dot"></i>
<select id="state">
<option value="">Select State</option>
</select>
</div>

<div class="input-group">
<i class="fa fa-location-dot"></i>
<select id="city">
<option value="">Select City</option>
</select>
</div>

<button onclick="saveProfile()">Continue</button>

<p id="msg"></p>

</div>

<script>

window.addEventListener("pageshow", function(event) {
    if (event.persisted) {
        window.location.reload()
    }
})

// 🔥 DATA
let data = {
"Delhi": ["New Delhi","Dwarka","Rohini"],
"UP": ["Noida","Ghaziabad","Lucknow"],
"Haryana": ["Gurgaon","Faridabad"]
}

// 🔥 ELEMENTS
let stateSelect = document.getElementById("state")
let citySelect = document.getElementById("city")

// 🔥 LOAD STATES
for(let state in data){
let opt = document.createElement("option")
opt.value = state
opt.text = state
stateSelect.add(opt)
}

// 🔥 LOAD CITIES
stateSelect.addEventListener("change",function(){

citySelect.innerHTML = '<option value="">Select City</option>'

if(data[this.value]){
data[this.value].forEach(city=>{
let opt = document.createElement("option")
opt.value = city
opt.text = city
citySelect.add(opt)
})
}

})

// 🔥 AUTO FILL + FIX CITY DROPDOWN
window.onload = function(){

let email = localStorage.getItem("user_email")
let saved = JSON.parse(localStorage.getItem(email+"_profile"))

if(saved){

document.getElementById("name").value = saved.name || ""
document.getElementById("phone").value = saved.phone || ""
document.getElementById("college").value = saved.college || ""

// 🔥 FIX: city dropdown reload
if(saved.location){

document.getElementById("state").value = "UP"

// trigger city load
stateSelect.dispatchEvent(new Event("change"))

setTimeout(()=>{
document.getElementById("city").value = saved.location
},200)

}

}

}

// 🔥 MAIN FUNCTION
function saveProfile(){

let name = document.getElementById("name").value.trim()
let phone = document.getElementById("phone").value.trim()
let location = document.getElementById("city").value
let college = document.getElementById("college").value.trim()
let file = document.getElementById("idCard").files[0]

let msg = document.getElementById("msg")

// ❌ VALIDATION
if(name=="" || phone=="" || location=="" || college=="" || !file){

msg.style.display="block"
msg.style.background="#ff4d4d"
msg.style.color="white"
msg.innerText="❌ Fill all details + upload ID"

setTimeout(()=> msg.style.display="none",2000)
return
}

// ⏳ LOADING
msg.style.display="block"
msg.style.background="#333"
msg.style.color="white"
msg.innerText="⏳ Verifying ID..."

// 🔥 SEND TO BACKEND
let formData = new FormData()
formData.append("name", name)
formData.append("college", college)
formData.append("id_card", file)

fetch("https://roomzy-czyc.onrender.com/verify-id", {
method:"POST",
body:formData
})
.then(res=>res.json())
.then(data=>{

console.log("API Response:", data)

// ❌ ERROR HANDLE
if(data.error){
msg.style.background="#ff4d4d"
msg.innerText="❌ " + data.error
return
}

// ❌ FAKE
if(data.status && data.status.includes("fake")){
msg.style.background="#ff4d4d"
msg.innerText="❌ Invalid ID Card"
return
}

// ⚠ PARTIAL
if(data.status && data.status.includes("partial")){
msg.style.background="#ffc107"
msg.style.color="black"
msg.innerText="⚠️ Partial match (Check ID)"
return
}

// ✅ VERIFIED
if(data.status && data.status.includes("verified")){

let reader = new FileReader()

reader.onload = function(){

let email = localStorage.getItem("user_email")

let profile = {
name:name,
phone:phone,
location:location,
college:college,
idCard:reader.result,
verified:true
}

localStorage.setItem(email+"_profile", JSON.stringify(profile))

msg.style.background="#28a745"
msg.style.color="white"
msg.innerText="✅ Verified & Saved"

setTimeout(()=>{
window.location.href="student_home.html"
},1000)

}

reader.readAsDataURL(file)

}

})
.catch(()=>{
msg.style.background="#ff4d4d"
msg.style.color="white"
msg.innerText="❌ Server error"
})

}

</script>

</body>
</html>
