<!DOCTYPE html>
<html>

<head>

<title>My Profile</title>

<style>

*{
box-sizing:border-box;
font-family:Segoe UI;
}

body{
margin:0;
height:100vh;
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:400px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
padding:35px;
border-radius:15px;
box-shadow:0 8px 32px rgba(0,0,0,0.3);
color:white;
text-align:center;
}

h2{
margin-bottom:20px;
}

input, select{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:6px;
}

button{
width:100%;
padding:12px;
border:none;
background:linear-gradient(90deg,#ff7a18,#ffb347);
color:white;
border-radius:6px;
cursor:pointer;
}

img{
width:80px;
height:80px;
border-radius:50%;
margin-bottom:10px;
object-fit:cover;
}

</style>

</head>

<body>

<div class="container">

<h2>My Profile</h2>

<!-- ✅ USER PROFILE PIC (separate) -->
<img id="photoPreview" src="https://i.pravatar.cc/80">

<input type="file" id="photo">

<!-- ✅ Editable -->
<input id="name">
<input type="date" id="dob">
<select id="gender">
<option value="">Select Gender</option>
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other</option>
</select>

<!-- ❌ NOT EDITABLE -->
<input id="email" disabled>

<button onclick="save()">Save Changes</button>

<p id="msg" style="display:none; color:white; margin-top:10px;">
✅ Profile Updated
</p>

</div>

<script>

// 🔥 LOAD DATA
let email = localStorage.getItem("user_email")
let saved = JSON.parse(localStorage.getItem(email+"_profile"))

// email show
document.getElementById("email").value = email || ""

// name + gender from student_profile
if(saved){
document.getElementById("name").value = saved.name || ""
document.getElementById("dob").value = saved.dob || ""
document.getElementById("gender").value = saved.gender || ""
}

// 🔥 LOAD USER FACE PIC (separate key)
let pic = localStorage.getItem("user_profile_pic")

if(pic){
document.getElementById("photoPreview").src = pic
}


// 🔥 UPLOAD NEW PROFILE PIC (FACE PIC)
document.getElementById("photo").addEventListener("change",function(){

let reader = new FileReader()

reader.onload = function(){

// 🔥 SAVE DIFFERENTLY (NOT ID CARD)
localStorage.setItem("user_profile_pic", reader.result)

// preview
document.getElementById("photoPreview").src = reader.result

}

reader.readAsDataURL(this.files[0])

})


// 🔥 SAVE CHANGES
function save(){

let name = document.getElementById("name").value
let dob = document.getElementById("dob").value
let gender = document.getElementById("gender").value

// update existing profile
let profile = JSON.parse(localStorage.getItem(email+"_profile")) || {}

profile.name = name
profile.dob = dob
profile.gender = gender

localStorage.setItem(email+"_profile", JSON.stringify(profile))

let msg = document.getElementById("msg")
msg.style.display = "block"

setTimeout(()=>{
msg.style.display = "none"
},2000)

}

</script>

</body>
</html>
