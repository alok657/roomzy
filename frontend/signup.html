<!DOCTYPE html>
<html>

<head>

<title>Roomzy - Signup</title>

<style>
*{
box-sizing:border-box;
font-family:Segoe UI;
}

body{
margin:0;
height:100vh;
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:380px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
padding:40px;
border-radius:15px;
box-shadow:0 8px 32px rgba(0,0,0,0.3);
color:white;
}

h2{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:6px;
outline:none;
}

button{
width:100%;
padding:12px;
border:none;
background:linear-gradient(90deg,#ff7a18,#ffb347);
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

#msg{
margin-top:10px;
text-align:center;
font-weight:bold;
display:none;
}

.login-link{
text-align:center;
margin-top:15px;
font-size:14px;
}

.login-link a{
color:#ffd369;
text-decoration:none;
font-weight:bold;
}
.password-box{
    position: relative;
}

.password-box input{
    width: 100%;
    padding: 12px;
    padding-right: 45px;
}

.toggle-eye{
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
    color: #333;
    z-index: 10;
}

.toggle-eye:hover{
    color: #ff7a18;
}

</style>

</head>

<body>

<div class="container">

<h2>Create Account</h2>

<input type="email" id="email" placeholder="Email">
<div class="password-box">
    <input type="password" id="password" placeholder="Password (8+ chars, A-Z, a-z, 0-9, @#$)">
    <span class="toggle-eye" onclick="togglePassword()">👁</span>
</div>
<button onclick="signup()">Signup</button>

<div id="msg"></div>

<div class="login-link">
Already have an account?  
<a href="login.html">Login</a>
</div>

</div>

<script>

// 🔥 BACKEND WARM-UP
setTimeout(()=>{
    fetch("https://roomzy.onrender.com/test")
},1000)

// 👁 TOGGLE PASSWORD FUNCTION
function togglePassword(){
    let input = document.getElementById("password")

    if(input.type === "password"){
        input.type = "text"
    } else {
        input.type = "password"
    }
}

function signup(){

let email = document.getElementById("email").value.trim()
let password = document.getElementById("password").value.trim()

let msg = document.getElementById("msg")
let btn = document.querySelector("button")

// 🔥 LOADING START
msg.style.display = "block"
msg.style.color = "#ffd369"
msg.innerText = "Processing..."
btn.disabled = true

// ❌ EMPTY CHECK
if( email=="" || password==""){
msg.style.display="block"
msg.style.color="red"
msg.innerText="Fill all fields"

alert("Please fill all details")   

btn.disabled = false
return
}

// 🔥 EMAIL VALIDATION
let emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/
if(!emailPattern.test(email)){
msg.style.color="red"
msg.innerText="Invalid email"

alert("Enter valid email")

btn.disabled = false
return
}

// 🔥 PASSWORD VALIDATION
if(password.length<8 ||
!/[A-Z]/.test(password) ||
!/[a-z]/.test(password) ||
!/[0-9]/.test(password) ||
!/[!@#$%^&*]/.test(password)){
msg.style.color="red"
msg.innerText="Weak password"

alert("Password must be strong")

btn.disabled = false
return
}

// ✅ API CALL
fetch("https://roomzy.onrender.com/signup",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
password:password
})
})
.then(res=>res.json())
.then(data=>{

if(data.status==="success"){
msg.style.color="#00ff88"
msg.innerText="📩 Verification email sent! Check your inbox"
}
else if(data.status==="pending"){
msg.style.color="#ffd369"
msg.innerText=data.message   // resend case
}
else{
msg.style.color="red"
msg.innerText=data.message
}

btn.disabled = false

})
.catch(()=>{
msg.style.color="red"
msg.innerText="Server error"
btn.disabled = false
})

}

</script>

</body>

</html>
