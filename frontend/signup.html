<!DOCTYPE html>
<html>

<head>

<title>Roomzy - Signup</title>

<style>
*{
box-sizing:border-box;
font-family:Segoe UI;
}

body{
margin:0;
height:100vh;
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:380px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
padding:40px;
border-radius:15px;
box-shadow:0 8px 32px rgba(0,0,0,0.3);
color:white;
}

h2{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:6px;
outline:none;
}

button{
width:100%;
padding:12px;
border:none;
background:linear-gradient(90deg,#ff7a18,#ffb347);
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

#msg{
margin-top:10px;
text-align:center;
font-weight:bold;
display:none;
}

.login-link{
text-align:center;
margin-top:15px;
font-size:14px;
}

.login-link a{
color:#ffd369;
text-decoration:none;
font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h2>Create Account</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password (8+ chars, A-Z, a-z, 0-9, @#$)">

<button onclick="signup()">Signup</button>

<div id="msg"></div>

<div class="login-link">
Already have an account?  
<a href="login.html">Login</a>
</div>

</div>

<script>

function signup(){

let name=document.getElementById("name").value.trim()
let email=document.getElementById("email").value.trim()
let password=document.getElementById("password").value.trim()

let msg=document.getElementById("msg")

// ❌ EMPTY CHECK
if(name=="" || email=="" || password==""){
alert("Fill all fields")
return
}

// 🔥 EMAIL VALIDATION
let emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/
if(!emailPattern.test(email)){
alert("Invalid email")
return
}

// 🔥 PASSWORD VALIDATION
if(password.length<8 ||
!/[A-Z]/.test(password) ||
!/[a-z]/.test(password) ||
!/[0-9]/.test(password) ||
!/[!@#$%^&*]/.test(password)){
alert("Password must be strong (A-Z, a-z, 0-9, special char)")
return
}

// ✅ API CALL
fetch("https://roomzy-czyc.onrender.com/signup",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
name:name,
email:email,
password:password
})
})
.then(res=>res.json())
.then(data=>{

msg.style.display="block"

if(data.status==="success"){
msg.style.color="#00ff88"
msg.innerText="📩 Verification email sent! Check your inbox"

setTimeout(()=>{
window.location.href="login.html"
},2000)
}
else{
msg.style.color="red"
msg.innerText=data.message
}

})
.catch(()=>{
alert("Server error")
})

}

</script>

</body>

</html>
