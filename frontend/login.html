<!DOCTYPE html>

<html>

<head>

<title>Roomzy - Login</title>

<style>

*{
box-sizing:border-box;
font-family:Segoe UI;
}

body{
margin:0;
height:100vh;
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:380px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
padding:40px;
border-radius:15px;
box-shadow:0 8px 32px rgba(0,0,0,0.3);
color:white;
}

h2{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:6px;
outline:none;
}

button{
width:100%;
padding:12px;
border:none;
background:linear-gradient(90deg,#ff7a18,#ffb347);
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

#msg{
margin-top:10px;
text-align:center;
font-weight:bold;
display:none;
}

.signup-link{
text-align:center;
margin-top:15px;
font-size:14px;
}

.signup-link a{
color:#ffd369;
text-decoration:none;
font-weight:bold;
}

.password-box{
position: relative;
}

.password-box input{
width: 100%;
padding: 12px;
padding-right: 45px;
}

.toggle-eye{
position: absolute;
right: 12px;
top: 50%;
transform: translateY(-50%);
cursor: pointer;
font-size: 18px;
color: #333;
z-index: 10;
}

.toggle-eye:hover{
color: #ff7a18;
}

</style>

</head>

<body>

<div class="container">

<h2>Login</h2>

<input type="email" id="email" placeholder="Email">

<div class="password-box">
<input type="password" id="password" placeholder="Password">
<span class="toggle-eye" onclick="togglePassword()">👁</span>
</div>

<button onclick="login()">Login</button>

<div id="msg"></div>

<div class="signup-link">
Don't have an account?
<a href="signup.html">Signup</a>
</div>

</div>

<script>

const API_URL = "https://roomzy-czyc.onrender.com"

// warmup
setTimeout(()=>{
fetch(API_URL + "/test")
},1000)

// verify message
let params = new URLSearchParams(window.location.search)

if(params.get("verified") === "true"){
let msg = document.getElementById("msg")
msg.style.display = "block"
msg.style.color = "#00ff88"
msg.innerText = "✅ Email verified! Please login"
}

// password toggle
function togglePassword(){
let input = document.getElementById("password")
input.type = input.type === "password" ? "text" : "password"
}

// 🔥 LOGIN FUNCTION (UPDATED FLOW)
function login(){

let email = document.getElementById("email").value.trim()
let password = document.getElementById("password").value.trim()

let msg = document.getElementById("msg")
let btn = document.querySelector("button")

msg.style.display = "block"
msg.style.color = "#ffd369"
msg.innerText = "Processing..."
btn.disabled = true

// validation
if(email=="" || password==""){
msg.style.color="red"
msg.innerText="Please fill all details"
btn.disabled = false
return
}

let emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/
if(!emailPattern.test(email)){
msg.style.color="red"
msg.innerText="Invalid email"
btn.disabled = false
return
}

// API CALL
fetch(API_URL + "/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
password:password
})
})
.then(res=>res.json())
.then(data=>{

if(data.status=="success"){

msg.style.color="#00ff88"
msg.innerText="Login successful"

// save user
localStorage.setItem("user_email", data.email)
localStorage.setItem("user_name", data.name)

if(data.role === "admin"){
    console.log("ADMIN LOGIN DETECTED")
    window.location.href = "admin.html"
    return
}

// 🔥 DIRECT FLOW (NO ROLE)
let profile = JSON.parse(localStorage.getItem(data.email+"_profile"))

if(!profile){
window.location.href = "student_profile.html"
}
else{
window.location.href = "student_home.html"
}

}
else{
msg.style.color="red"
msg.innerText=data.message || "Invalid login"
}

btn.disabled = false

})
.catch(()=>{
msg.style.color="red"
msg.innerText="Server error"
btn.disabled = false
})

}


</script>

</body>

</html>
