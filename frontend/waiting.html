<h2>⏳ Waiting for Admin Approval</h2>
<p>Your profile is under verification</p>

<script>

let email = localStorage.getItem("user_email")

// 🔁 HAR 3 SECOND CHECK
setInterval(()=>{

fetch("https://roomzy.onrender.com/check-status/" + email)
.then(res=>res.json())
.then(data=>{

// ✅ CORRECT CHECK
if(data.status === "approved"){

    localStorage.setItem("profile_done", "yes")
    
    window.location.href = "student_home.html"
}

// 🔥 optional (reject case)
else if(data.status === "rejected"){
    alert("❌ Fill details correctly")

    window.location.href = "student_profile.html"
}

})

}, 3000)

</script>
