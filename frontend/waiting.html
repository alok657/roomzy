<h2>⏳ Waiting for Admin Approval</h2>
<p>Your profile is under verification</p>

<script>

let email = localStorage.getItem("user_email")

// 🔁 HAR 3 SECOND CHECK
setInterval(()=>{

fetch("https://roomzy-czyc.onrender.com/check-status/" + email)
.then(res=>res.json())
.then(data=>{

if(data.approved){
    // ✅ APPROVED → HOME PAGE
    window.location.href = "student_home.html"
}

})

}, 3000)

</script>
