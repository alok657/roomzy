<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
        }

        h1 {
            color: #00ffcc;
        }

        button {
            padding: 10px 20px;
            background: #00ffcc;
            border: none;
            cursor: pointer;
            margin: 10px;
        }

        li {
            list-style: none;
            background: #222;
            margin: 5px;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<h1>Admin Dashboard 🔥</h1>

<button onclick="loadUsers()">Load Users</button>
<button onclick="loadPending()">Pending Requests 🔥</button>
<button onclick="goHome()">🏠 View Website</button>

<ul id="users"></ul>

<script>

    function goHome(){
    window.location.href = "student_home.html"
}

if(localStorage.getItem("user_role") !== "admin"){
    alert("Access Denied ❌")
    window.location.href="login.html"
}

function loadUsers() {
    fetch("https://roomzy-czyc.onrender.com/all-users")
    .then(res => res.json())
    .then(data => {
        let list = document.getElementById("users");
        list.innerHTML = "";

        data.forEach(user => {
            let li = document.createElement("li");
            li.innerText = user.name + " - " + user.email;
            list.appendChild(li);
        });
    });
}

function loadPending(){

fetch("https://roomzy-czyc.onrender.com/pending_users")
.then(res=>res.json())
.then(data=>{

let list = document.getElementById("users")
list.innerHTML = ""

data.forEach(u=>{

list.innerHTML += `
<li>

${u.name} (${u.email})

<br>
<img src="https://roomzy-czyc.onrender.com/${u.id_card}" width="120">

<br>

<button onclick="approve(${u.id})">Approve</button>
<button onclick="reject(${u.id})">Reject</button>

</li>
`

})

})
}

function approve(id){
fetch("https://roomzy-czyc.onrender.com/approve_user/" + id,{
method:"POST"
})
.then(()=>loadPending())
}

function reject(id){
fetch("https://roomzy-czyc.onrender.com/reject_user/" + id,{
method:"POST"
})
.then(()=>loadPending())
}

</script>

</body>
</html>
