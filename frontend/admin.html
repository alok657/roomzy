<!DOCTYPE html>
<html>
<head>

<title>Admin Dashboard</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#f4f6f9;
}

/* HEADER */
.header{
background:white;
padding:15px 25px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
display:flex;
justify-content:space-between;
align-items:center;
}

.header h2{
margin:0;
}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
text-align:center;
}

.card h3{
margin:0;
font-size:24px;
color:#1e88e5;
}

.card p{
margin:5px 0 0;
color:#666;
}

/* TABLE */
.section{
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#f1f5f9;
}

tr:hover{
background:#f9fafb;
}

/* BUTTON */
.btn{
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
}

.approve{background:#22c55e;color:white;}
.reject{background:#ef4444;color:white;}

img.preview{
width:60px;
height:60px;
border-radius:6px;
cursor:pointer;
object-fit:cover;
}

</style>

</head>

<body>

<div class="header">
<h2>⚙️ Admin Dashboard</h2>
<button onclick="location.href='student_home.html'">🏠 Home</button>
</div>

<!-- STATS -->
<div class="stats">

<div class="card">
<h3 id="totalUsers">0</h3>
<p>Total Users</p>
</div>

<div class="card">
<h3 id="totalPG">0</h3>
<p>Total PGs</p>
</div>

<div class="card">
<h3 id="pendingUsers">0</h3>
<p>Pending Profiles</p>
</div>

<div class="card">
<h3 id="savedCount">0</h3>
<p>Total Favorites</p>
</div>

</div>

<!-- USERS -->
<div class="section">
<h3>👤 All Users</h3>
<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
</tr>
</thead>
<tbody id="userTable"></tbody>
</table>
</div>

<!-- 🔥 UPDATED PENDING -->
<div class="section">
<h3>⏳ Pending Approvals</h3>
<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>College</th>
<th>ID Card</th>
<th>Role</th>
<th>Action</th>
</tr>
</thead>
<tbody id="pendingTable"></tbody>
</table>
</div>

<!-- PG TABLE -->
<div class="section">
<h3>🏠 All PG Listings</h3>

<table>
<thead>
<tr>
<th>PG Name</th>
<th>City</th>
<th>Rent</th>
<th>Owner</th>
</tr>
</thead>

<tbody id="pgTable"></tbody>

</table>
</div>

<script>

// USERS
function loadUsers(){
fetch("https://roomzy-c7d0.onrender.com/all-users")
.then(res=>res.json())
.then(data=>{
document.getElementById("totalUsers").innerText = data.length

let table = document.getElementById("userTable")
table.innerHTML=""

data.forEach(u=>{
table.innerHTML += `
<tr>
<td>${u.name}</td>
<td>${u.email}</td>
</tr>`
})
})
}

// PG COUNT
function loadPG(){
fetch("https://roomzy-c7d0.onrender.com/get_pgs")
.then(res=>res.json())
.then(data=>{
document.getElementById("totalPG").innerText = data.length
})
}

// 🔥 UPDATED PENDING
function loadPending(){
fetch("https://roomzy-c7d0.onrender.com/pending_users")
.then(res=>res.json())
.then(data=>{

document.getElementById("pendingUsers").innerText = data.length

let table = document.getElementById("pendingTable")
table.innerHTML=""

data.forEach(u=>{

table.innerHTML += `
<tr>
<td>${u.name || "N/A"}</td>
<td>${u.email}</td>
<td>${u.college || "N/A"}</td>

<td>
<img src="https://roomzy-c7d0.onrender.com/uploads/${u.id_card}" 
class="preview"
onclick="viewImage('${u.id_card}')">
</td>

<td style="font-weight:bold; color:${u.role==='owner'?'orange':'blue'}">
${u.role}
</td>

<td>
<button class="btn approve" onclick="approve(${u.id})">Approve</button>
<button class="btn reject" onclick="reject(${u.id})">Reject</button>
</td>
</tr>
`
})

})
}

// 🔥 IMAGE VIEW
function viewImage(src){
let full = "https://roomzy-c7d0.onrender.com/uploads/" + src
let win = window.open("")
win.document.write(`<img src="${full}" style="width:100%">`)
}

// APPROVE
function approve(id){
fetch("https://roomzy-c7d0.onrender.com/approve_user/"+id,{method:"POST"})
.then(()=>{
alert("✅ Approved")
loadPending()
})
}

// REJECT
function reject(id){
fetch("https://roomzy-c7d0.onrender.com/reject_user/"+id,{method:"POST"})
.then(()=>{
alert("❌ Rejected")
loadPending()
})
}

// FAVORITES
function loadSaved(){
let saved = JSON.parse(localStorage.getItem("saved")) || []
document.getElementById("savedCount").innerText = saved.length
}

// PG LIST
function loadPGs(){
fetch("https://roomzy-c7d0.onrender.com/get_pgs")
.then(res=>res.json())
.then(data=>{
let table = document.getElementById("pgTable")
table.innerHTML = ""

data.forEach(pg=>{
table.innerHTML += `
<tr>
<td>${pg.pg_name}</td>
<td>${pg.city}</td>
<td>₹ ${pg.rent}</td>
<td>${pg.owner_name}</td>
</tr>`
})
})
}

// INIT
loadUsers()
loadPG()
loadPending()
loadSaved()
loadPGs()

</script>

</body>
</html>
