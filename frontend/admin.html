<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
        }

        h1 {
            color: #00ffcc;
        }

        button {
            padding: 8px 15px;
            background: #00ffcc;
            border: none;
            cursor: pointer;
            margin: 5px;
            border-radius: 6px;
        }

        li {
            list-style: none;
            background: #1a1a1a;
            margin: 15px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        img {
            margin-top: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>Admin Dashboard 🔥</h1>

<button onclick="loadUsers()">All Users</button>
<button onclick="loadPending()">Pending Requests 🔥</button>
<button onclick="goHome()">🏠 View Website</button>

<ul id="users"></ul>

<script>

function goHome(){
    window.location.href = "student_home.html"
}

// 🔐 ADMIN CHECK
if(localStorage.getItem("user_role") !== "admin"){
    alert("Access Denied ❌")
    window.location.href="login.html"
}

// ================= ALL USERS =================
function loadUsers() {
    fetch("https://roomzy-czyc.onrender.com/all-users")
    .then(res => res.json())
    .then(data => {

        let list = document.getElementById("users")
        list.innerHTML = ""

        data.forEach(user => {

            list.innerHTML += `
            <li>
                ${user.name} - ${user.email}
            </li>
            `

        })
    })
}

// ================= PENDING USERS =================
function loadPending(){

fetch("https://roomzy-czyc.onrender.com/pending_users")
.then(res=>res.json())
.then(data=>{

let list = document.getElementById("users")
list.innerHTML = ""

data.forEach(u=>{

list.innerHTML += `
<li>

<h3>${u.name} (${u.email})</h3>

<img src="https://roomzy-czyc.onrender.com/uploads/${u.id_card.split('/').pop()}" width="160">

<br><br>

<b>Name:</b> ${u.profile.name || "-"} <br>
<b>Phone:</b> ${u.profile.phone || "-"} <br>
<b>College:</b> ${u.profile.college || "-"} <br>
<b>Location:</b> ${u.profile.location || "-"} <br>

<br><br>

<button onclick="approve(${u.id})">✅ Approve</button>
<button onclick="reject(${u.id})">❌ Reject</button>

</li>
`

})

})
}

// ================= APPROVE =================
function approve(id){
fetch("https://roomzy-czyc.onrender.com/approve_user/" + id,{
method:"POST"
})
.then(()=>{
alert("User Approved ✅")
loadPending()
})
}

// ================= REJECT =================
function reject(id){
fetch("https://roomzy-czyc.onrender.com/reject_user/" + id,{
method:"POST"
})
.then(()=>{
alert("User Rejected ❌")
loadPending()
})
}

</script>

</body>
</html>
